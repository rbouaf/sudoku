[versions]
agp = "9.2.1"
kotlin = "2.4.0"

# The ALPHA BOM, deliberately: it pins compose ui/foundation 1.13.0-beta02 and
# material3 1.5.0-beta02 together. Checked latest on dl.google.com 2026-10-27.
composeBom = "2026.10.01"
material3 = "1.5.0-beta02"

activityCompose = "1.13.0"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
datastore = "1.2.1"
# Decision G5: track the newest graphics-shapes. material3 1.5.0-beta02 still compiles against
# 1.0.1, so 1.1.0 is a deliberate override; verified on device before keeping it.
graphicsShapes = "1.1.0"

junit = "4.13.2"

[libraries]
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom-alpha", version.ref = "composeBom" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-text = { group = "androidx.compose.ui", name = "ui-text" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes", version.ref = "graphicsShapes" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
org-json = { group = "org.json", name = "json", version = "20250517" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
